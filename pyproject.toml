[project]
name = "financial-analyst-agent"
version = "0.1.0"
description = ""
authors = [
    { name = "Richard Andrés", email = "62516404+andresm-data@users.noreply.github.com" },
]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14,<4.0.0"
dependencies = ["langchain-chroma (>=1.1.0,<2.0.0)", "pandas (>=3.0.6,<4.0.0)", "requests (>=2.34.2,<3.0.0)", "pyyaml (>=6.0.3,<7.0.0)", "python-dotenv (>=1.2.4,<2.0.0)", "duckdb (>=2.0.0,<3.0.0)", "beautifulsoup4 (>=4.15.0,<5.0.0)", "lxml (>=6.1.3,<7.0.0)", "langchain-ollama (>=1.1.0,<2.0.0)", "torch (>=2.15.0,<3.0.0)", "langchain-huggingface (>=1.2.3,<2.0.0)", "sentence-transformers (>=6.2.0,<7.0.0)", "langchain-text-splitters (>=1.1.3,<2.0.0)"]

[project.scripts]
download_10k = "financial_analyst_agent.ingest.download_10k:run"
html_to_text = "financial_analyst_agent.ingest.html_to_text:run"
load_financials = "financial_analyst_agent.ingest.load_financials:run"
sections = "financial_analyst_agent.ingest.sections:run"
run_all = "financial_analyst_agent.ingest.run_all:run"
chunks = "financial_analyst_agent.rag.chunking:run"

[tool.poetry]
packages = [{ include = "financial_analyst_agent", from = "src" }]

[[tool.poetry.source]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"

[tool.poetry.dependencies]
torch = {source = "pytorch-cpu"}

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = ["pytest (>=9.1.1,<10.0.0)", "pytest-cov (>=7.1.0,<8.0.0)"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "--cov --cov-report=term-missing"

[tool.coverage.run]
source = ["src/financial_analyst_agent"]
branch = true

[tool.coverage.report]
skip_empty = true
exclude_also = ['if __name__ == .__main__.:']
