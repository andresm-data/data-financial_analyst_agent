# `aliases`: otros nombres con que se reconoce al banco en una pregunta (RAG).
# El ticker C no se usa como alias porque es una letra suelta.
banks:
  - ticker: JPM
    name: JPMorgan Chase
    aliases: [JPMorgan, JPMorganChase, J.P. Morgan, JPM]
    info: Banco más grande de EE.UU.
    cik: "0000019617"

  - ticker: BAC
    name: Bank of America
    aliases: [BofA, BAC]
    info: Banca de consumo y empresas
    cik: "0000070858"

  - ticker: C
    name: Citigroup
    aliases: [Citi]
    info: Con mucha presencia internacional
    cik: "0000831001"

  - ticker: GS
    name: Goldman Sachs
    aliases: [Goldman, GS]
    info: Banca de inversión
    cik: "0000886982"

  - ticker: MS
    name: Morgan Stanley
    aliases: [MS]
    info: Inversión y gestión del patrimonio
    cik: "0000895421"

  - ticker: TFC
    name: Truist Financial Corp
    aliases: [Truist, TFC]
    info: Banco regional
    cik: "0000092230"
