# Parámetros del RAG. Cambiar estos valores cambia el resultado sin tocar código.
#
# Referencia: chunks de 1000 (overlap 150). La prueba con 500 (overlap 75) no
# ganó con claridad y fue menos fiel al contexto; ver docs/results.md.
chunking:
  chunk_size: 1000     # caracteres máximos por chunk (500 en la prueba 2)
  chunk_overlap: 150   # caracteres que se repiten entre chunks seguidos (75 en la prueba 2)
  min_chunk_chars: 200 # los chunks más cortos se unen a un vecino si cabe
  # Dónde cortar, en orden de preferencia: bloques (tablas/texto), líneas,
  # frases, cláusulas, palabras y caracteres. Debe empezar por "\n\n".
  separators: ["\n\n", "\n", ". ", "; ", " ", ""]

# Dónde se guardan los chunks y el índice de Chroma, relativo a la raíz del
# repo. Cada tamaño de chunk tiene los suyos, así que los índices conviven.
# Para repetir la prueba con 500 (chunk_size 500, chunk_overlap 75):
#   chunks_file: data/processed/chunks/chunks_500.jsonl
#   chroma_dir: data/chroma_500
index:
  chunks_file: data/processed/chunks/chunks.jsonl
  chroma_dir: data/chroma
